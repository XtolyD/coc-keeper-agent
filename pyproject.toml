[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coc-keeper-agent"
version = "2.1.0"
description = "CoC 7th 版跑团 KP Agent —— 用于学习 Agent 构建工程的入门项目"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
  "pymupdf>=1.24",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
coc-keeper = "coc_keeper.cli:main"
coc-keeper-web = "coc_keeper.web:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coc_keeper = ["web_static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
